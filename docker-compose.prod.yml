# ==========================================================================
# LIBERTASIAN — Production Docker Compose
# Per PDD Section 10: VPS-Friendly Phase 1 Deployment
# ==========================================================================
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Requires:
#   - .env file with production secrets
#   - SSL certificates in ./infrastructure/nginx/ssl/
#   - Images pre-built or registry access configured

services:
  # ====================
  # Reverse Proxy
  # ====================
  nginx:
    image: nginx:1.27-alpine
    container_name: libertasian-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [frontend, storage]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

  # ====================
  # Web App (Next.js)
  # ====================
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://libertasian.com/api/v1}
        NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-false}
        NEXT_PUBLIC_FEATURE_BAR_EXAM_ANSWERS_PUBLIC: ${NEXT_PUBLIC_FEATURE_BAR_EXAM_ANSWERS_PUBLIC:-false}
    container_name: libertasian-web
    restart: always
    expose:
      - "3000"
    env_file: .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [frontend]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  # ====================
  # NestJS API
  # ====================
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: libertasian-api
    restart: always
    expose:
      - "3001"
    env_file: .env
    environment:
      NODE_ENV: production
      APP_PORT: "3001"
      # Dev parity: apps/api/package.json sets TZ=Asia/Manila on the dev script.
      TZ: Asia/Manila
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_ENABLED: "true"
      JWT_PRIVATE_KEY_PATH: /secrets/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /secrets/jwt-public.pem
    volumes:
      - ./infrastructure/secrets/jwt-private.pem:/secrets/jwt-private.pem:ro
      - ./infrastructure/secrets/jwt-public.pem:/secrets/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [frontend, backend, ai, storage]
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G

  # ====================
  # PostgreSQL + pgvector
  # ====================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: libertasian-postgres
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-libertasian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-libertasian}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-libertasian}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
    networks: [backend, storage]
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "autovacuum_vacuum_scale_factor=0.01"
      - "-c"
      - "log_min_duration_statement=1000"

  # ====================
  # Redis
  # ====================
  redis:
    image: redis:7-alpine
    container_name: libertasian-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    # noeviction: this Redis instance is shared by BullMQ (bull:*),
    # Celery (celery:*), sessions, and application cache. allkeys-lru
    # would silently evict queue state and cause job loss under memory
    # pressure. Every cache write MUST set a TTL — see CLAUDE.md.
    # When cache and queues are split into separate instances, the
    # cache-only instance can switch back to allkeys-lru.
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend, ai]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 768M

  # ====================
  # OpenSearch
  # ====================
  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: libertasian-opensearch
    restart: always
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:9200 -u admin:${OPENSEARCH_PASSWORD} | grep -q 'opensearch'"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [ai]
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 3G

  # ====================
  # MinIO (Object Storage)
  # ====================
  minio:
    image: minio/minio:latest
    container_name: libertasian-minio
    restart: always
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [storage]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  minio-init:
    image: minio/mc:latest
    container_name: libertasian-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY};
      mc mb --ignore-existing myminio/libertasian-uploads;
      mc mb --ignore-existing myminio/libertasian-corpus;
      exit 0;
      "
    env_file: .env
    networks: [storage]

  # ====================
  # ClamAV (Malware Scanning)
  # ====================
  clamav:
    image: clamav/clamav:1.4
    container_name: libertasian-clamav
    restart: always
    expose:
      - "3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  # ====================
  # OCR Service (Python)
  # ====================
  ocr-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.ocr
    container_name: libertasian-ocr-service
    restart: always
    expose:
      - "8002"
    environment:
      OCR_TESSERACT_CMD: tesseract
      OCR_TESSERACT_LANG: eng
      OCR_QUALITY_REJECT_THRESHOLD: "0.2"
      OCR_QUALITY_WARN_THRESHOLD: "0.4"
      OCR_MAX_IMAGE_WIDTH: "2048"
      OCR_MAX_IMAGE_HEIGHT: "2048"
      OCR_INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [ai]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  # ====================
  # RAG Service (Python FastAPI)
  # ====================
  rag-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.rag
    container_name: libertasian-rag-service
    restart: always
    expose:
      - "8000"
    env_file: .env
    environment:
      RAG_OPENSEARCH_URL: https://opensearch:9200
      RAG_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RAG_DATABASE_URL: postgresql://${POSTGRES_USER:-libertasian}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-libertasian}
      RAG_INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # The kNN retrieval leg's input. Without this the leg is skipped entirely
      # and retrieval is BM25-only — which is what prod did until now, since
      # nothing passed an embedding to hybrid_retrieve. Note the RAG_ prefix:
      # rag-service's Settings uses env_prefix="RAG_", so a bare
      # EMBEDDING_SERVICE_URL would be read by nothing.
      #
      # Both containers are on the `ai` network, so this name resolves. NOT a
      # `depends_on`: embedding-service being down must degrade retrieval to
      # BM25-only, never hold up or fail rag-service.
      RAG_EMBEDDING_SERVICE_URL: http://embedding-service:8001
      # Cross-encoder reranking of the fused BM25+kNN candidate set. Without it
      # passages keep their RRF order, which ranks by position rather than
      # relevance. Same `ai` network, same RAG_ prefix caveat, and same
      # deliberate absence of a `depends_on`: a reranker that is down must
      # degrade ordering, never hold up or fail rag-service.
      RAG_RERANKER_URL: http://reranker-service:8002
    depends_on:
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [ai, storage]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  # ====================
  # TTS Service (Kokoro-82M)
  # ====================
  # Internal only: `expose`, never `ports`, and NOT referenced by nginx. The
  # API is its sole client.
  tts-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.tts
    container_name: libertasian-tts-service
    restart: always
    expose:
      - "8003"
    environment:
      TTS_DEFAULT_VOICE: ${KOKORO_VOICE_ID:-af_heart}
      # Passed EXPLICITLY, so the CPU shape stays pinned here rather than
      # depending on what src/device.py would resolve. Leaving them unset would
      # reach the same 2 x 4 on this box (no GPU) — stating them keeps the
      # measured prod shape visible in the deployment, not just in code.
      TTS_WORKERS: ${TTS_WORKERS:-2}
      TTS_THREADS_PER_WORKER: ${TTS_THREADS_PER_WORKER:-4}
      # No GPU on this box, so 'auto' resolves to cpu. It resolves EXPLICITLY
      # now (and /health reports the result), rather than being left to kokoro's
      # internal fallback.
      TTS_DEVICE: ${TTS_DEVICE:-auto}
      # Empty here by design — this hop never leaves the internal network. The
      # API reads the same variable, so both sides are on or off together.
      TTS_AUTH_TOKEN: ${TTS_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [ai]
    deploy:
      resources:
        limits:
          # 2 workers x 4 threads = 8 of the box's 12 vCPU, leaving headroom
          # for the API. Raise only after measuring on the VPS.
          cpus: "8"
          # MEASURED, not taste: a single worker mid-synthesis reached 2.9 GiB
          # RSS on prod (2026-07-29). At the previous 4G limit two concurrent
          # workers would almost certainly OOM.
          memory: 8G

  # ====================
  # Worker Service (Celery)
  # ====================
  worker-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: libertasian-worker-service
    restart: always
    env_file: .env
    environment:
      WORKER_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      WORKER_CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      WORKER_DATABASE_URL: postgresql://${POSTGRES_USER:-libertasian}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-libertasian}
      WORKER_OCR_SERVICE_URL: http://ocr-service:8002
      WORKER_RAG_SERVICE_URL: http://rag-service:8000
      WORKER_EMBEDDING_SERVICE_URL: http://embedding-service:8001
      WORKER_NESTJS_API_URL: http://api:3001/api/v1
      WORKER_INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      WORKER_S3_ENDPOINT: http://minio:9000
      WORKER_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      WORKER_S3_SECRET_KEY: ${S3_SECRET_KEY}
      WORKER_S3_BUCKET_UPLOADS: libertasian-uploads
      WORKER_S3_BUCKET_CORPUS: libertasian-corpus
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
      rag-service:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    networks: [ai, storage]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  # ====================
  # Worker Beat (Celery Scheduler)
  # ====================
  worker-beat:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: libertasian-worker-beat
    restart: always
    command: ["celery", "-A", "src.celery_app", "beat", "--loglevel=info"]
    env_file: .env
    # Override Dockerfile healthcheck: `celery inspect ping` pings workers,
    # not beat, so it always fails on a beat-only container and had been
    # marking libertasian-worker-beat as unhealthy in production. Check for
    # a live beat process instead (pgrep requires procps, which is installed
    # in Dockerfile.worker's runtime stage).
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
    environment:
      WORKER_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      WORKER_CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      WORKER_DATABASE_URL: postgresql://${POSTGRES_USER:-libertasian}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-libertasian}
      WORKER_OCR_SERVICE_URL: http://ocr-service:8002
      WORKER_RAG_SERVICE_URL: http://rag-service:8000
      WORKER_EMBEDDING_SERVICE_URL: http://embedding-service:8001
      WORKER_NESTJS_API_URL: http://api:3001/api/v1
      WORKER_INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      WORKER_S3_ENDPOINT: http://minio:9000
      WORKER_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      WORKER_S3_SECRET_KEY: ${S3_SECRET_KEY}
      WORKER_S3_BUCKET_UPLOADS: libertasian-uploads
      WORKER_S3_BUCKET_CORPUS: libertasian-corpus
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [ai]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ====================
  # Embedding Service (Python)
  # ====================
  embedding-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.embedding
    container_name: libertasian-embedding-service
    restart: always
    expose:
      - "8001"
    environment:
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
      EMBEDDING_EMBEDDING_DIM: "${EMBEDDING_DIM:-384}"
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_MAX_BATCH_SIZE: "64"
      EMBEDDING_INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [ai]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  # ====================
  # Reranker Service (Python)
  # ====================
  # Cross-encoder that scores the fused BM25+kNN candidate set by relevance.
  # Internal only: `expose`, never `ports`, and not referenced by nginx —
  # rag-service is its sole client.
  reranker-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.reranker
    container_name: libertasian-reranker-service
    restart: always
    expose:
      - "8002"
    environment:
      RERANKER_MODEL_NAME: ${RERANKER_MODEL_NAME:-BAAI/bge-reranker-base}
      RERANKER_DEVICE: ${RERANKER_DEVICE:-cpu}
      RERANKER_INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # All three MUST equal the `cpus` limit below, and each other. Torch,
      # OpenMP and MKL each size their own pool from the host core count and
      # none of them reads the cgroup quota, so an unset value means one thread
      # per host core contending for a fraction of one — the thrash that made
      # 30 passages take 11.2-11.5s against rag-service's 10s timeout before
      # any of this was pinned.
      RERANKER_TORCH_THREADS: ${RERANKER_TORCH_THREADS:-8}
      OMP_NUM_THREADS: ${RERANKER_TORCH_THREADS:-8}
      MKL_NUM_THREADS: ${RERANKER_TORCH_THREADS:-8}
      # A guard, not an optimisation. `max_length` truncates, it does not pad
      # — sequences pad to the longest item in the batch — and rag-service
      # already truncates passages to 1000 characters (~250 tokens), so this
      # cap almost never binds and benchmarks show no measurable effect. It
      # stays because it bounds the worst case if a caller ever sends an
      # oversized passage. See services/reranker-service/src/config.py.
      RERANKER_MAX_LENGTH: ${RERANKER_MAX_LENGTH:-256}
      # Off, and now on prod evidence rather than pending it. Tried on the
      # prod x86_64 host: ALL THREE backends reported unusable — fbgemm,
      # onednn and qnnpack — each with empty exception args. The service
      # validated each with a real forward pass, rejected all of them, fell
      # back to fp32 and reported `quantized: false` on /health, which is
      # exactly the designed behaviour. So this is NOT arm64-specific: int8
      # dynamic quantization has failed on every platform tested so far.
      # torch 2.13 is deprecating this eager-mode API in favour of torchao,
      # which is where a retry should start.
      RERANKER_QUANTIZE: ${RERANKER_QUANTIZE:-false}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [ai]
    deploy:
      resources:
        limits:
          # 8, sized from prod measurements rather than from a local box.
          #
          # Thread pinning (5651046) fixed the oversubscription but not the
          # arithmetic: prod's AMD EPYC vCPUs are roughly 2.2x slower per core
          # than the arm64 machine the original figures came from, so the same
          # image needs more of them. Benched on prod, host idle, 30 passages,
          # same image, against rag-service's 10s reranker_timeout:
          #
          #   cpus  p50      p95
          #   4     11.91s   13.38s   <- misses the timeout on every call
          #   6      7.86s    8.33s   <- fits, with 1.7s of headroom
          #   8      6.92s    7.10s   <- fits, with 2.9s of headroom
          #
          # 6 is enough on an IDLE host. 8 is chosen for headroom on a loaded
          # one: 1.7s is less than the run-to-run spread already visible in
          # these numbers, so a busy box would push a 6-CPU container back over
          # the timeout and silently return every query to RRF ordering. The
          # extra two cores buy the margin that keeps that from being a
          # coin-flip. Score spread was 3900.9x at all three quotas, so this is
          # purely a latency decision — CPU count does not touch the math.
          #
          # Keep RERANKER_TORCH_THREADS (and OMP/MKL) equal to this number.
          cpus: "8"
          # Higher than embedding-service's 2G: bge-reranker-base is ~278M
          # params (~1.1GB resident as fp32) against bge-small-en-v1.5's ~33M,
          # plus the torch runtime. The container runs ONE uvicorn worker for
          # exactly this reason — see Dockerfile.reranker.
          memory: 3G

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
  minio_data:
  clamav_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  ai:
    driver: bridge
  storage:
    driver: bridge
