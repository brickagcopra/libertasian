<?xml version="1.0" encoding="UTF-8"?>
<!--
  Master icon source: warm-cream background flattened behind the owl mark.
  Rasterized to:
    - apps/mobile/assets/icon.png        (1024 x 1024, no alpha, iOS master)
    - apps/mobile/assets/store/play-icon-512.png (512 x 512, no alpha)

  Both Apple and Google require icons WITHOUT an alpha channel and WITHOUT
  rounded corners (the platform applies the mask). Background colour is the
  brand warm-cream (#f6f1e8) matching the splash and adaptive-icon backdrops.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  role="img"
  aria-label="LIBERTASIAN app icon"
>
  <rect x="0" y="0" width="1024" height="1024" fill="#f6f1e8" />

  <path
    d="
      M 220 460
      C 220 360, 252 280, 304 232
      L 332 188
      Q 348 178, 358 196
      L 368 264
      Q 432 224, 512 224
      Q 592 224, 656 264
      L 666 196
      Q 676 178, 692 188
      L 720 232
      C 772 280, 804 360, 804 460
      C 804 600, 778 720, 700 788
      Q 620 836, 512 836
      Q 404 836, 324 788
      C 246 720, 220 600, 220 460
      Z
    "
    fill="#1c1a14"
  />

  <circle cx="424" cy="436" r="92" fill="#d87b2a" />
  <circle cx="424" cy="436" r="72" fill="#faefd9" />
  <circle cx="424" cy="436" r="34" fill="#1c1a14" />
  <circle cx="412" cy="424" r="10" fill="#ffffff" />

  <circle cx="600" cy="436" r="92" fill="#d87b2a" />
  <circle cx="600" cy="436" r="72" fill="#faefd9" />
  <circle cx="600" cy="436" r="34" fill="#1c1a14" />
  <circle cx="588" cy="424" r="10" fill="#ffffff" />

  <path d="M 512 552 L 488 510 L 536 510 Z" fill="#b65e13" />

  <path d="M 452 660 L 572 660" stroke="#d87b2a" stroke-width="10" stroke-linecap="round" />
  <path d="M 452 696 L 572 696" stroke="#d87b2a" stroke-width="10" stroke-linecap="round" />
  <path d="M 452 732 L 572 732" stroke="#d87b2a" stroke-width="10" stroke-linecap="round" />
</svg>
