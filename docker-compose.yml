version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: libertasian-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: libertasian
      POSTGRES_PASSWORD: libertasian_dev
      POSTGRES_DB: libertasian
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libertasian"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: libertasian-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # noeviction: shared with BullMQ/Celery — see docker-compose.prod.yml
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: libertasian-opensearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=LibertasianDev2024!
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:9200 -u admin:LibertasianDev2024! | grep -q 'opensearch'"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: libertasian-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: libertasian
      MINIO_ROOT_PASSWORD: libertasian_dev_secret
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: libertasian-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 libertasian libertasian_dev_secret;
      mc mb --ignore-existing myminio/libertasian-uploads;
      mc mb --ignore-existing myminio/libertasian-corpus;
      exit 0;
      "

  clamav:
    image: clamav/clamav:1.4
    container_name: libertasian-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  ocr-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.ocr
    container_name: libertasian-ocr-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      OCR_TESSERACT_CMD: tesseract
      OCR_TESSERACT_LANG: eng
      OCR_QUALITY_REJECT_THRESHOLD: "0.2"
      OCR_QUALITY_WARN_THRESHOLD: "0.4"
      OCR_MAX_IMAGE_WIDTH: "2048"
      OCR_MAX_IMAGE_HEIGHT: "2048"
      OCR_DEBUG: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  embedding-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.embedding
    container_name: libertasian-embedding-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      EMBEDDING_MODEL_NAME: BAAI/bge-small-en-v1.5
      EMBEDDING_EMBEDDING_DIM: "384"
      EMBEDDING_DEVICE: cpu
      EMBEDDING_MAX_BATCH_SIZE: "64"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  tts-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.tts
    container_name: libertasian-tts-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      TTS_DEFAULT_VOICE: af_heart
      # Explicit CPU shape; src/device.py would resolve the same 2 x 4 on a box
      # with no GPU. /health reports what was actually resolved.
      TTS_WORKERS: "2"
      TTS_THREADS_PER_WORKER: "4"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: libertasian-worker-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
    environment:
      WORKER_REDIS_URL: redis://redis:6379/0
      WORKER_CELERY_RESULT_BACKEND: redis://redis:6379/1
      WORKER_DATABASE_URL: postgresql://libertasian:libertasian_dev@postgres:5432/libertasian
      WORKER_OCR_SERVICE_URL: http://ocr-service:8002
      WORKER_S3_ENDPOINT: http://minio:9000
      WORKER_S3_ACCESS_KEY: libertasian
      WORKER_S3_SECRET_KEY: libertasian_dev_secret
      WORKER_S3_BUCKET_UPLOADS: libertasian-uploads
      WORKER_S3_BUCKET_CORPUS: libertasian-corpus

  worker-beat:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: libertasian-worker-beat
    restart: unless-stopped
    command: ["celery", "-A", "src.celery_app", "beat", "--loglevel=info"]
    # Override Dockerfile healthcheck: `celery inspect ping` pings workers,
    # not beat, so it always fails on a beat-only container. Check for a live
    # beat process instead.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      WORKER_REDIS_URL: redis://redis:6379/0
      WORKER_CELERY_RESULT_BACKEND: redis://redis:6379/1
      WORKER_DATABASE_URL: postgresql://libertasian:libertasian_dev@postgres:5432/libertasian
      WORKER_S3_ENDPOINT: http://minio:9000
      WORKER_S3_ACCESS_KEY: libertasian
      WORKER_S3_SECRET_KEY: libertasian_dev_secret

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
  minio_data:
  clamav_data:
