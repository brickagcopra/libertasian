name: Security Scan

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 6am UTC

permissions:
  contents: read
  security-events: write

jobs:
  # ====================
  # Node.js Dependency Audit
  # ====================
  node-audit:
    name: Node.js Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit Node.js dependencies
        run: pnpm audit --audit-level moderate
        continue-on-error: true

  # ====================
  # Python Dependency Audit
  # ====================
  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [rag-service, worker-service, ocr-service, embedding-service, reranker-service]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: uv sync

      - name: Audit Python dependencies
        working-directory: services/${{ matrix.service }}
        run: uv pip audit
        continue-on-error: true

  # ====================
  # Trivy Container Image Scan
  # ====================
  trivy-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: infrastructure/docker/Dockerfile.api
          - service: web
            dockerfile: infrastructure/docker/Dockerfile.web
          - service: rag-service
            dockerfile: infrastructure/docker/Dockerfile.rag
          - service: ocr-service
            dockerfile: infrastructure/docker/Dockerfile.ocr
          - service: worker-service
            dockerfile: infrastructure/docker/Dockerfile.worker
          - service: embedding-service
            dockerfile: infrastructure/docker/Dockerfile.embedding
          - service: tts-service
            dockerfile: infrastructure/docker/Dockerfile.tts
          - service: reranker-service
            dockerfile: infrastructure/docker/Dockerfile.reranker
    steps:
      - uses: actions/checkout@v4

      # embedding-service, worker-service, tts-service and reranker-service
      # bundle large ML deps (torch, sentence-transformers) and the resulting
      # image plus Trivy's layer export exceeds the default runner disk. Free
      # up the pre-installed tooling we don't need before building.
      # reranker-service is the largest of them: it also bakes a ~1.1GB model
      # into the image, measured at ~7GB total locally.
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Build image for scanning
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            -t libertasian-${{ matrix.service }}:scan \
            .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: libertasian-${{ matrix.service }}:scan
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      # Upload requires repo-level Code Scanning to be enabled. Until then
      # the step fails with "Resource not accessible by integration"; the
      # scan itself has already completed by this point, so don't fail the
      # job on upload. Once Code Scanning is enabled the upload succeeds.
      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  # ====================
  # Secret Scanning
  # ====================
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned to a release tag, not @main. This scanner gates every PR, so an
      # unpinned action means the version that decides whether a PR merges can
      # change under us with no commit here — it had already moved to 3.96.0 by
      # the time anyone looked.
      #
      # `--exclude-detectors=lob`: Lob's key pattern is
      # `(test|live)_[A-Za-z0-9_]{35}`, so ANY Python test function whose name
      # after `test_` is exactly 35 word-characters is a literal match. There
      # are ~53 such names on main already, and `test_blank_passages_do_not_
      # consume_top_k` (PR #387) tripped it. `--only-verified` does not filter
      # these out: the Lob verifier's API call succeeds, so the finding is
      # reported as VERIFIED. We have no Lob integration anywhere — `grep -ri
      # lob` over package.json / pyproject.toml / requirements*.txt returns
      # nothing — so the detector can only ever fire on a function name here.
      # Excluding it costs no real coverage and stops a scanner that fails
      # unpredictably on a rename from teaching everyone to ignore it.
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          extra_args: --only-verified --exclude-detectors=lob
