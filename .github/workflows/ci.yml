name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @libertasian/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @libertasian/api prisma:generate

      - name: Build all packages
        run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: libertasian
          POSTGRES_PASSWORD: libertasian_test
          POSTGRES_DB: libertasian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://libertasian:libertasian_test@localhost:5432/libertasian_test
      REDIS_URL: redis://localhost:6379/0
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @libertasian/api prisma:generate

      - name: Run migrations
        run: pnpm --filter @libertasian/api prisma:migrate:dev -- --name test

      - name: Run tests
        run: pnpm test

      # The only check that exercises REAL Metro resolution over every runtime
      # import in the mobile app. Nothing else does: tsc resolves
      # @libertasian/types via its "types": "./src/index.ts" field, and jest
      # maps the package straight to source — so a package whose "main" points
      # at a gitignored, unbuilt dist/ passes both and still fails to bundle.
      #
      # That exact bug shipped: the first VALUE import of @libertasian/types
      # (src/features/search/document-types.ts, 2026-07-27) went unnoticed
      # until the next EAS build, which died in EAGER_BUNDLE. Same root cause
      # had already been patched per-consumer in Dockerfile.web (#217) and
      # Dockerfile.api (#309).
      #
      # No `rm -rf packages/types/dist` here, deliberately: dist/ is gitignored,
      # so a CI runner's checkout never has one. It exists at this point ONLY
      # because packages/types' `prepare` script built it during the install
      # above — which is exactly the property under test. Deleting it and not
      # reinstalling would assert the broken state and fail every run.
      #
      # Measured locally: 15s to pass, 16s to fail on the real bug — no native
      # tooling needed, this is Metro and node only.
      - name: Guard — @libertasian/types resolves at runtime
        working-directory: apps/mobile
        run: node -e "require('@libertasian/types')"

      - name: Guard — mobile bundle resolves from a clean checkout
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/bundle-guard"

      # apps/api/jest.config.ts has rootDir 'src', so apps/api/test/*.e2e-spec.ts
      # was never discovered by `pnpm test` and the e2e suite had never executed
      # anywhere. It boots the REAL AppModule and needs nothing beyond the
      # postgres and redis services already declared above — verified locally:
      # the health suite (66 tests) and the account-deletion suite (14 tests)
      # both pass against pg + redis alone, with no OpenSearch, MinIO or ClamAV.
      #
      # Scope: this runs the specs added by the account-deletion epic, not the
      # whole e2e directory. Running all 53 suites today gives 58 failures
      # across 17 suites (1,022 of 1,081 tests pass) — pre-existing rot from a
      # suite that has never been executed, not regressions from this branch.
      # Fixing those is its own piece of work; see PENDING_TASKS.md. This step
      # genuinely runs and genuinely fails — it is not a soft-fail or a skip.
      # Add spec paths here as suites are repaired.
      - name: Run E2E tests
        run: pnpm --filter @libertasian/api test:e2e:ci test/account-deletion.e2e-spec.ts
