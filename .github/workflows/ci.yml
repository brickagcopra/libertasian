name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs before the toolchain setup on purpose: it is pure grep, needs no
      # node or pnpm, and fails in seconds instead of after a full install.
      #
      # Both #360 (web pages) and #364 (mobile store doc, API email template)
      # found these by hand. The only prior guard,
      # apps/web/src/features/homepage/server/business-info.test.ts, asserts
      # over rendered web content only and saw neither #364 surface. That file
      # is excluded below because it legitimately names both addresses in its
      # DEAD_MAILBOXES exclusion list.
      #
      # These mailboxes reject at SMTP (450 — mailbox does not exist). Publishing
      # them was a likely contributor to the Xendit KYC rejection. DELETE THIS STEP
      # once dpo@/legal@ exist as real mailboxes in the Namecheap PrivateEmail panel
      # AND a test send to each is confirmed delivered — at that point they are
      # publishable again and this guard becomes wrong.
      - name: Guard — no dead mailboxes published
        run: |
          if grep -rIn \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=.next \
            --exclude-dir=build \
            --exclude-dir=coverage \
            --exclude=business-info.test.ts \
            -e 'dpo@libertasian\.com' \
            -e 'legal@libertasian\.com' \
            apps/ services/ packages/
          then
            echo
            echo "::error::Dead mailbox published — dpo@ and legal@libertasian.com reject at SMTP (450, mailbox does not exist). Use libertasianphilippines@gmail.com (privacy/DPO of record) or support@libertasian.com (monitored daily)."
            exit 1
          fi
          echo "OK — no published references to dpo@ or legal@libertasian.com."

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @libertasian/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

  # ====================
  # OpenSearch field contract (rag-service <-> index-mappings.ts)
  # ====================
  #
  # The ONLY CI check that runs any Python test. It exists because a read-side
  # field-name mismatch is invisible everywhere else in the stack:
  #
  #   `_knn_search` queried `knn: {"embedding": ...}` while the vector index
  #   maps `embedding_vector`. Every kNN query returned HTTP 400 "all shards
  #   failed", hybrid_retrieve caught it as an acceptable degradation, and the
  #   AI answer pipeline ran BM25-only on 100% of queries for months. Two
  #   sibling mismatches (`source_authority_level` for `source_trust_level`,
  #   `plain_text` for `text_snippet`) rode along, silently disabling the
  #   authority boost.
  #
  # The mappings are `dynamic: 'strict'`, so a bad WRITE fails loudly — but a
  # bad READ does not: an unmapped `_source` field is simply omitted from the
  # response. Nothing typed the two sides together, and the pre-existing unit
  # test asserted the buggy field name, so it passed throughout.
  #
  # Scoped deliberately to the contract suite rather than the whole rag-service
  # suite: `tests/test_routers.py` has 40 pre-existing pytest-asyncio fixture
  # errors that are their own piece of work (see PENDING_TASKS.md). Widening
  # this to `pytest tests/` is the right follow-up once those are fixed.
  opensearch-field-contract:
    name: Guard — service contracts (OpenSearch fields, reranker API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rag-service dependencies
        working-directory: services/rag-service
        run: uv sync --all-extras

      - name: Assert query fields exist in the index mappings
        working-directory: services/rag-service
        run: uv run pytest tests/test_index_field_contract.py -q

      # The rag-service <-> reranker-service API contract. Same reasoning as
      # the OpenSearch one: `core/reranking.py` builds and parses plain dicts,
      # reranker-service declares Pydantic models in a different package, and
      # nothing types the two together. A drift on either side is caught by
      # `rerank_passages` and turned into an RRF fallback — an answer still
      # comes back, just ordered by rank position instead of relevance. Runs in
      # rag-service's venv and loads the service's schema module by file path,
      # because both packages are named `src`.
      - name: Assert the reranker API contract holds
        working-directory: services/rag-service
        run: uv run pytest tests/test_rerank_contract.py tests/test_reranking.py -q

      - name: Install reranker-service dependencies
        working-directory: services/reranker-service
        run: uv sync --all-extras

      # The reranker's own suite is small, has no external dependencies (the
      # model is mocked) and covers the sigmoid contract that
      # `abstention_score_threshold` now depends on. Unlike rag-service's full
      # suite it is green, so it runs whole.
      - name: Run reranker-service tests
        working-directory: services/reranker-service
        run: uv run pytest tests/ -q

      - name: Type-check reranker-service
        working-directory: services/reranker-service
        run: uv run mypy --strict src/

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @libertasian/api prisma:generate

      - name: Build all packages
        run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: libertasian
          POSTGRES_PASSWORD: libertasian_test
          POSTGRES_DB: libertasian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://libertasian:libertasian_test@localhost:5432/libertasian_test
      REDIS_URL: redis://localhost:6379/0
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @libertasian/api prisma:generate

      - name: Run migrations
        run: pnpm --filter @libertasian/api prisma:migrate:dev -- --name test

      - name: Run tests
        run: pnpm test

      # The only check that exercises REAL Metro resolution over every runtime
      # import in the mobile app. Nothing else does: tsc resolves
      # @libertasian/types via its "types": "./src/index.ts" field, and jest
      # maps the package straight to source — so a package whose "main" points
      # at a gitignored, unbuilt dist/ passes both and still fails to bundle.
      #
      # That exact bug shipped: the first VALUE import of @libertasian/types
      # (src/features/search/document-types.ts, 2026-07-27) went unnoticed
      # until the next EAS build, which died in EAGER_BUNDLE. Same root cause
      # had already been patched per-consumer in Dockerfile.web (#217) and
      # Dockerfile.api (#309).
      #
      # No `rm -rf packages/types/dist` here, deliberately: dist/ is gitignored,
      # so a CI runner's checkout never has one. It exists at this point ONLY
      # because packages/types' `prepare` script built it during the install
      # above — which is exactly the property under test. Deleting it and not
      # reinstalling would assert the broken state and fail every run.
      #
      # Measured locally: 15s to pass, 16s to fail on the real bug — no native
      # tooling needed, this is Metro and node only.
      - name: Guard — @libertasian/types resolves at runtime
        working-directory: apps/mobile
        run: node -e "require('@libertasian/types')"

      # NODE_ENV must not be `test` here. The job sets it for the API suites,
      # but babel-preset-expo branches on it: under `test` it skips inlining
      # EXPO_ROUTER_APP_ROOT, and expo-router's _ctx.android.js then fails to
      # compile with "Invalid call at line 2: process.env.EXPO_ROUTER_APP_ROOT".
      # A production bundle is also what EAS actually builds, so this matches.
      - name: Guard — mobile bundle resolves from a clean checkout
        working-directory: apps/mobile
        env:
          NODE_ENV: production
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/bundle-guard"

      # apps/api/jest.config.ts has rootDir 'src', so apps/api/test/*.e2e-spec.ts
      # was never discovered by `pnpm test` and the e2e suite had never executed
      # anywhere. It boots the REAL AppModule and needs nothing beyond the
      # postgres and redis services already declared above — verified locally:
      # the health suite (66 tests) and the account-deletion suite (14 tests)
      # both pass against pg + redis alone, with no OpenSearch, MinIO or ClamAV.
      #
      # Scope: this runs the specs added by the account-deletion epic, not the
      # whole e2e directory. Running all 53 suites today gives 58 failures
      # across 17 suites (1,022 of 1,081 tests pass) — pre-existing rot from a
      # suite that has never been executed, not regressions from this branch.
      # Fixing those is its own piece of work; see PENDING_TASKS.md. This step
      # genuinely runs and genuinely fails — it is not a soft-fail or a skip.
      # Add spec paths here as suites are repaired.
      - name: Run E2E tests
        run: pnpm --filter @libertasian/api test:e2e:ci test/account-deletion.e2e-spec.ts
