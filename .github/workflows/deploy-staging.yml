name: Deploy to Staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/libertasian

jobs:
  # ====================
  # Build & Push Docker Images
  # ====================
  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: infrastructure/docker/Dockerfile.api
          - service: web
            dockerfile: infrastructure/docker/Dockerfile.web
          - service: rag-service
            dockerfile: infrastructure/docker/Dockerfile.rag
          - service: ocr-service
            dockerfile: infrastructure/docker/Dockerfile.ocr
          - service: worker-service
            dockerfile: infrastructure/docker/Dockerfile.worker
          - service: embedding-service
            dockerfile: infrastructure/docker/Dockerfile.embedding
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging-latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ====================
  # Deploy to Staging VPS
  # ====================
  deploy:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build-images
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "sha=staging-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            cd /opt/libertasian

            # Pull latest compose and config files
            git fetch origin main
            git checkout origin/main -- docker-compose.prod.yml infrastructure/

            # Log in to container registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Set image tag for this deployment
            export IMAGE_TAG="${{ steps.tag.outputs.sha }}"
            export REGISTRY="${{ env.REGISTRY }}"
            export IMAGE_PREFIX="${{ env.IMAGE_PREFIX }}"

            # Pull new images
            docker compose -f docker-compose.staging.yml pull

            # Run database migrations
            docker compose -f docker-compose.staging.yml run --rm \
              -e DATABASE_URL="${DATABASE_URL}" \
              api npx prisma migrate deploy

            # Rolling restart services (zero-downtime for stateless services)
            docker compose -f docker-compose.staging.yml up -d --remove-orphans

            # Wait for health checks
            echo "Waiting for services to become healthy..."
            sleep 10

            # Verify API health
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3001/api/v1/health > /dev/null 2>&1; then
                echo "API is healthy"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "API health check failed after 30 attempts"
                exit 1
              fi
              sleep 2
            done

            # Verify Web health
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3000 > /dev/null 2>&1; then
                echo "Web app is healthy"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Web health check failed after 30 attempts"
                exit 1
              fi
              sleep 2
            done

            # Clean up old images
            docker image prune -f --filter "until=72h"

            echo "Staging deployment complete: $IMAGE_TAG"

      - name: Post deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? 'deployed' : 'failed';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: status === 'deployed' ? 'success' : 'failure',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: `Staging deployment ${status}`,
              context: 'staging/deploy'
            });
