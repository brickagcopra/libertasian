name: Deploy to Production

on:
  release:
    types: [published]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/libertasian

jobs:
  # ====================
  # Validate Release
  # ====================
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format: $TAG (expected vX.Y.Z)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying version: $TAG"

  # ====================
  # Build & Push Production Images
  # ====================
  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: infrastructure/docker/Dockerfile.api
          - service: web
            dockerfile: infrastructure/docker/Dockerfile.web
          - service: rag-service
            dockerfile: infrastructure/docker/Dockerfile.rag
          - service: ocr-service
            dockerfile: infrastructure/docker/Dockerfile.ocr
          - service: worker-service
            dockerfile: infrastructure/docker/Dockerfile.worker
          - service: embedding-service
            dockerfile: infrastructure/docker/Dockerfile.embedding
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

  # ====================
  # Database Backup (Pre-Deploy)
  # ====================
  backup:
    name: Pre-Deploy Database Backup
    runs-on: ubuntu-latest
    needs: build-images
    environment: production
    steps:
      - name: Create pre-deploy backup via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            BACKUP_FILE="/opt/libertasian/backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql.gz"
            mkdir -p /opt/libertasian/backups

            docker exec libertasian-postgres pg_dump \
              -U "${POSTGRES_USER:-libertasian}" \
              -d "${POSTGRES_DB:-libertasian}" \
              --format=custom \
              --no-owner \
              --verbose \
              | gzip > "$BACKUP_FILE"

            echo "Backup created: $BACKUP_FILE ($(du -h "$BACKUP_FILE" | cut -f1))"

  # ====================
  # Deploy to Production
  # ====================
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [build-images, backup]
    environment:
      name: production
      url: https://libertasian.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            VERSION="${{ needs.validate.outputs.version || github.event.release.tag_name }}"
            DEPLOY_DIR="/opt/libertasian"
            ROLLBACK_TAG_FILE="$DEPLOY_DIR/.last-deployed-tag"

            cd "$DEPLOY_DIR"

            # Save current tag for rollback
            if [ -f "$ROLLBACK_TAG_FILE" ]; then
              cp "$ROLLBACK_TAG_FILE" "$DEPLOY_DIR/.rollback-tag"
            fi
            echo "$VERSION" > "$ROLLBACK_TAG_FILE"

            # Pull latest compose and config files
            git fetch origin main --tags
            git checkout "$VERSION" -- docker-compose.prod.yml infrastructure/

            # Log in to container registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull new images tagged with version
            export IMAGE_TAG="$VERSION"
            docker compose -f docker-compose.prod.yml pull

            # Run database migrations
            echo "Running database migrations..."
            docker compose -f docker-compose.prod.yml run --rm \
              api npx prisma migrate deploy

            # Deploy services (rolling restart)
            echo "Deploying services..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Health check loop
            echo "Waiting for services to become healthy..."
            sleep 15

            HEALTHY=true

            # Check API health
            for i in $(seq 1 60); do
              if curl -sf http://localhost:3001/api/v1/health > /dev/null 2>&1; then
                echo "API is healthy (attempt $i)"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "API health check failed"
                HEALTHY=false
              fi
              sleep 3
            done

            # Check Web health
            for i in $(seq 1 60); do
              if curl -sf http://localhost:3000 > /dev/null 2>&1; then
                echo "Web is healthy (attempt $i)"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "Web health check failed"
                HEALTHY=false
              fi
              sleep 3
            done

            if [ "$HEALTHY" = false ]; then
              echo "Deployment health checks failed. Manual rollback may be needed."
              echo "Rollback: docker compose -f docker-compose.prod.yml down && git checkout \$(cat .rollback-tag) -- docker-compose.prod.yml infrastructure/ && docker compose -f docker-compose.prod.yml up -d"
              exit 1
            fi

            # Clean up old images (keep last 72h)
            docker image prune -f --filter "until=72h"

            echo "Production deployment complete: $VERSION"

      - name: Create deployment record
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: (await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                environment: 'production',
                auto_merge: false,
                required_contexts: []
              })).data.id,
              state: 'success',
              environment_url: 'https://libertasian.com',
              description: `Deployed ${context.payload.release.tag_name}`
            });

      - name: Notify deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.release.id,
              body: `Production deployment of ${context.payload.release.tag_name} failed. [View logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });
