[project]
name = "libertasian-tts-service"
version = "0.1.0"
description = "Kokoro-82M TTS service for LIBERTASIAN Philippine legal AI platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "kokoro>=0.9.2",
    "numpy>=1.26.0",
    # Declared EXPLICITLY (not left transitive via kokoro) so the CPU index
    # pin in [tool.uv.sources] actually binds. A source pin only applies to a
    # declared project dependency; without this the build can resolve a
    # multi-GB CUDA wheel onto a box with no GPU.
    "torch>=2.5.0",
    # Exact CBR mp3 encoding. libsndfile's `compression_level` is an inverted
    # QUALITY knob (measured: 0.15 -> 144 kbps, 0.5 -> 80, 0.8 -> 40) and
    # cannot target a bitrate, so soundfile is not usable for this.
    "lameenc>=1.8.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14.0",
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.uv.sources]
# CPU-only wheels: the prod VPS is 12 vCPU AMD EPYC with NO GPU, and the
# default PyPI torch pulls a CUDA build that would never be used.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
