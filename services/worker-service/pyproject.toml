[project]
name = "libertasian-worker-service"
version = "0.1.0"
description = "Worker service for LIBERTASIAN background job processing"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "asyncpg>=0.30.0",
    "pillow>=11.0.0",
    "opencv-python-headless>=4.10.0",
    "pytesseract>=0.3.13",
    "numpy>=2.1.0",
    "psycopg2-binary>=2.9.10",
    "boto3>=1.35.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14.0",
    "ruff>=0.8.0",
    "pytest>=8.3.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
