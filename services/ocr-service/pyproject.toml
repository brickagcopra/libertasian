[project]
name = "libertasian-ocr-service"
version = "0.1.0"
description = "OCR and image quality scoring service for LIBERTASIAN"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pillow>=11.0.0",
    "opencv-python-headless>=4.10.0",
    "pytesseract>=0.3.13",
    "numpy>=2.1.0",
    "httpx>=0.28.0",
    "PyMuPDF>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14.0",
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
