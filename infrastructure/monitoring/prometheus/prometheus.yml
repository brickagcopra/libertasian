# ==========================================================================
# LIBERTASIAN — Prometheus Configuration
# Per PDD Section 15: Monitoring & Observability
# ==========================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alert-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # ====================
  # Prometheus Self-Monitoring
  # ====================
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ====================
  # NestJS API (Node.js Exporter)
  # ====================
  - job_name: "nestjs-api"
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:3001"]
        labels:
          service: api
          app: libertasian

  # ====================
  # Next.js Web App
  # ====================
  - job_name: "nextjs-web"
    metrics_path: /metrics
    static_configs:
      - targets: ["web:3000"]
        labels:
          service: web
          app: libertasian

  # ====================
  # Python RAG Service
  # ====================
  - job_name: "rag-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["rag-service:8000"]
        labels:
          service: rag
          app: libertasian

  # ====================
  # Python OCR Service
  # ====================
  - job_name: "ocr-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["ocr-service:8002"]
        labels:
          service: ocr
          app: libertasian

  # ====================
  # Python Embedding Service
  # ====================
  - job_name: "embedding-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["embedding-service:8001"]
        labels:
          service: embedding
          app: libertasian

  # ====================
  # PostgreSQL Exporter
  # ====================
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres
          app: libertasian

  # ====================
  # Redis Exporter
  # ====================
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis
          app: libertasian

  # ====================
  # OpenSearch (via node stats API)
  # ====================
  - job_name: "opensearch"
    metrics_path: /_prometheus/metrics
    static_configs:
      - targets: ["opensearch:9200"]
        labels:
          service: opensearch
          app: libertasian

  # ====================
  # Nginx Exporter
  # ====================
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          service: nginx
          app: libertasian

  # ====================
  # Node Exporter (System Metrics)
  # ====================
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: vps
          app: libertasian

  # ====================
  # cAdvisor (Container Metrics)
  # ====================
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          app: libertasian
